<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profilo in PDF · Danilo D'Auria</title>
<link rel="icon" href="../fenice.svg" type="image/svg+xml">
<style>
/* Lettore PDF del sito: le pagine come immagini nitide, adatte allo schermo del telefono */
:root { --notte: #14232e; --oro: #f2b33d; --alba: #fde9b0; --carta: #e9e3d8; --ink: #f6efe4; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--carta); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; }
.barra { position: sticky; top: 0; z-index: 2; background: var(--notte); color: var(--ink);
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px; }
.barra .titolo { flex: 1; min-width: 0; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra .titolo small { display: block; color: #c9d3da; font-size: .78rem; }
.barra a { flex: none; color: var(--notte); background: var(--oro); text-decoration: none; font-weight: 700; font-size: .9rem; padding: 8px 14px; border-radius: 99px; }
.barra a.chiaro { background: transparent; color: var(--alba); border: 1.5px solid rgba(253,233,176,.45); }
.pagine { display: grid; gap: 12px; padding: 12px max(8px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); justify-items: center; }
.pagina { width: 100%; max-width: 900px; aspect-ratio: 210 / 297; background: #fff; box-shadow: 0 2px 10px rgba(20,35,46,.18); position: relative; }
.pagina canvas { width: 100%; height: 100%; display: block; }
.pagina .n { position: absolute; right: 8px; bottom: 6px; font-size: .72rem; color: #8a96a0; }
.avviso { max-width: 560px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 12px; color: #1c2730; line-height: 1.5; }
.avviso a { color: #b8400c; font-weight: 700; }
</style>
<body>
<div class="barra">
  <div class="titolo" id="titolo">Profilo di Danilo D'Auria<small id="stato">Caricamento…</small></div>
  <a class="chiaro" href="../" data-torna>← Sito</a>
  <a id="scarica" href="#" download>Scarica</a>
</div>
<div class="pagine" id="pagine"></div>
<script src="../torna.js"></script>
<script src="pdfjs/pdf.min.js"></script>
<script>
(function () {
  var consentiti = ["Danilo_DAuria_Tecnologia_Gentile.pdf", "Danilo_DAuria_Tecnologia_Gentile_stampa.pdf"];
  var nome = decodeURIComponent((location.hash || "").slice(1));
  var guida = /^guide\/[a-z0-9-]+\.pdf$/.test(nome);
  if (consentiti.indexOf(nome) === -1 && !guida) nome = consentiti[0];
  var stampa = nome.indexOf("_stampa") !== -1;
  document.getElementById("scarica").href = nome;
  var titolo = guida ? "Guida gratuita" : stampa ? "Profilo da stampare" : "Profilo di Danilo D'Auria";
  document.getElementById("titolo").firstChild.textContent = titolo;
  document.title = (guida ? "Guida in PDF" : stampa ? "Profilo da stampare" : "Profilo in PDF") + " · Danilo D'Auria";
  var stato = document.getElementById("stato"), box = document.getElementById("pagine");
  function errore() {
    box.innerHTML = '<div class="avviso">Non riesco a mostrare il PDF qui. <a href="' + nome + '">Apritelo o scaricatelo direttamente</a>.</div>';
    stato.textContent = "";
  }
  if (!window.pdfjsLib) { errore(); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "pdfjs/pdf.worker.min.js";
  pdfjsLib.getDocument(nome).promise.then(function (pdf) {
    stato.textContent = pdf.numPages + " pagine A4";
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    function disegna(div, n) {
      if (div.dataset.fatto) return; div.dataset.fatto = "1";
      pdf.getPage(n).then(function (pag) {
        var base = pag.getViewport({ scale: 1 });
        var scala = (div.clientWidth * dpr) / base.width;
        var vp = pag.getViewport({ scale: scala });
        var c = document.createElement("canvas"); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        div.insertBefore(c, div.firstChild);
        pag.render({ canvasContext: c.getContext("2d"), viewport: vp });
      });
    }
    var osserva = "IntersectionObserver" in window ? new IntersectionObserver(function (voci) {
      voci.forEach(function (v) { if (v.isIntersecting) disegna(v.target, +v.target.dataset.n); });
    }, { rootMargin: "800px 0px" }) : null;
    for (var i = 1; i <= pdf.numPages; i++) {
      var d = document.createElement("div"); d.className = "pagina"; d.dataset.n = i;
      d.setAttribute("role", "img"); d.setAttribute("aria-label", "Pagina " + i + " di " + pdf.numPages);
      d.innerHTML = '<span class="n">' + i + " / " + pdf.numPages + "</span>";
      box.appendChild(d);
      if (osserva) osserva.observe(d); else disegna(d, i);
    }
  }, errore);
})();
</script>
<script>
/* sul telefono e sul tablet ogni collegamento si apre in una nuova scheda */
(function () {
  if (!(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (window.matchMedia && matchMedia("(pointer: coarse)").matches))) return;
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href]") : null; if (!a) return;
    var h = a.getAttribute("href") || "";
    if (!h || h.charAt(0) === "#" || /^(mailto|tel|sms|javascript|data|blob):/i.test(h) || a.hasAttribute("download")) return;
    a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener");
  }, true);
})();
</script>
</body>
</html>
