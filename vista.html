<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Progetto · Danilo D'Auria</title>
<link rel="icon" href="fenice.svg" type="image/svg+xml">
<meta name="theme-color" content="#14232e">
<style>
/* Apre un progetto di Danilo (danilodauria.github.io/…) con la barra del sito in alto: «Sito» riporta sempre indietro. */
:root { --notte: #14232e; --oro: #f2b33d; --alba: #fde9b0; --ink: #f6efe4; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--notte); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
.barra { flex: none; background: var(--notte); color: var(--ink); display: flex; align-items: center; gap: 10px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid rgba(253,233,176,.2); }
.barra a { flex: none; text-decoration: none; font-weight: 700; font-size: .9rem; padding: 8px 14px; border-radius: 99px; }
.barra .torna { background: var(--oro); color: var(--notte); }
.barra .solo { color: var(--alba); border: 1.5px solid rgba(253,233,176,.45); }
.barra .titolo { flex: 1; min-width: 0; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
iframe { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
<body>
<div class="barra">
  <a class="torna" id="torna" href="./" data-torna>← Sito</a>
  <span class="titolo" id="titolo">Progetto</span>
  <a class="solo" id="solo" href="./">Apri da solo</a>
</div>
<iframe id="vista" title="Progetto"></iframe>
<script src="torna.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), u = q.get("u") || "", da = q.get("da") || "progetti";
  var L = { it: ["← Sito", "Apri da solo"], en: ["← Website", "Open on its own"], fr: ["← Site", "Ouvrir seul"], es: ["← Sitio", "Abrir solo"], de: ["← Website", "Einzeln öffnen"], ro: ["← Site", "Deschide separat"] };
  var l = "it"; try { l = localStorage.getItem("dd-lingua") || "it"; } catch (e) {}
  if (!L[l]) l = "it";
  document.documentElement.lang = l;
  document.getElementById("torna").textContent = L[l][0]; document.getElementById("solo").textContent = L[l][1];
  document.getElementById("torna").href = "./#" + da.replace(/[^a-z0-9-]/gi, "");
  var dest;
  try { dest = new URL(u, location.href); } catch (e) { dest = null; }
  /* solo i progetti pubblicati qui, sullo stesso indirizzo */
  if (!dest || dest.origin !== location.origin || /^\/(vista\.html)?$/.test(dest.pathname)) { location.replace("./"); return; }
  var f = document.getElementById("vista");
  document.getElementById("solo").href = dest.href;
  f.src = dest.href;
  f.addEventListener("load", function () {
    try {
      var d = f.contentDocument, t = d.title || "";
      document.getElementById("titolo").textContent = t; document.title = t + " · Danilo D'Auria";
      /* i collegamenti verso altri siti (GitHub, download…) si aprono in questa scheda: il tasto Indietro riporta qui */
      d.addEventListener("click", function (e) {
        var a = e.target.closest ? e.target.closest("a[href]") : null; if (!a) return;
        var h = a.href; if (!h || /^(mailto|tel|javascript):/i.test(h) || a.hasAttribute("download")) return;
        var x = new URL(h, d.baseURI);
        if (x.origin !== location.origin || x.pathname === "/" || x.pathname === "/index.html") { e.preventDefault(); location.href = x.href; }
      }, true);
    } catch (e) {}
  });
})();
</script>
</body>
</html>
