# Come si ferma: scheda Actions › «Aggiorna i progetti» › menu «…» › Disable workflow (Enable lo riaccende).
# Dal file: commentare il blocco `on:` qui sotto. Un'esecuzione già partita va avanti: si annulla con «Cancel run».

name: Aggiorna i progetti

# Ogni ora controlla i repository pubblici di danilodauria e aggiorna progetti.json:
# i nuovi progetti e le nuove versioni compaiono sul sito da soli, anche nelle Novità e nel feed.
on:
  schedule:
    - cron: "17 * * * *"    # ogni ora (al minuto 17): una nuova versione arriva sul sito entro un'ora
  workflow_dispatch:        # pulsante «Run workflow» nella scheda Actions
  push:
    branches: [main]
    paths-ignore: [progetti.json, novita.json, feed.xml, index.html]

permissions:
  contents: write

concurrency:
  group: aggiorna-progetti
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      # Fissate all'impronta del commit, non all'etichetta: un'etichetta si può riscrivere.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Leggi i repository e le versioni
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 strumenti/aggiorna-progetti.py
      - name: Novità e feed
        run: python3 strumenti/novita.py
      - name: Versioni nelle schede della home
        run: python3 strumenti/versioni-schede.py
      - name: Pacchetto in arrivo
        if: ${{ vars.PACCHETTO_IN_ARRIVO == '1' }}
        run: |
          echo "::notice title=Pacchetto in arrivo::Questa esecuzione non pubblica niente: sulla macchina di Danilo c'e' un aggiornamenti.bundle da spedire. Quando ha finito, riporta la variabile PACCHETTO_IN_ARRIVO a 0 (Settings, Secrets and variables, Actions, Variables)."
      - name: Salva se qualcosa è cambiato
        if: ${{ vars.PACCHETTO_IN_ARRIVO != '1' }}
        run: |
          if git diff --quiet -- progetti.json novita.json feed.xml index.html; then
            echo "Nessuna novità."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add progetti.json novita.json feed.xml index.html
            git commit -m "Progetti aggiornati in automatico"
            for prova in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep 10
            done
            exit 1
          fi
