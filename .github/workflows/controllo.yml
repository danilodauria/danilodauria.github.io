name: Controllo settimanale

# Ogni lunedì controlla link delle fonti, link interni e file locali, bandi in scadenza, date da rivedere, traduzioni mancanti e accessibilità.
# Se c'è qualcosa da fare apre (o aggiorna) un avviso nella scheda «Issues»: GitHub vi manda un'email.
# Se è tutto in ordine, chiude l'avviso aperto. Si può lanciare anche a mano: Actions › Controllo settimanale › Run workflow.
on:
  schedule:
    - cron: "23 6 * * 1"   # lunedì alle 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frasi da tradurre
        timeout-minutes: 12
        continue-on-error: true
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          timeout 420 python strumenti/i18n/estrai-testi.py http://127.0.0.1:8765/ || echo "Estrazione delle frasi non riuscita"
      - name: Accessibilità (axe-core)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          npm install --prefix /tmp/axe axe-core@4.10.2 >/dev/null 2>&1
          timeout 300 python strumenti/accessibilita/controlla.py http://127.0.0.1:8765/ /tmp/axe/node_modules/axe-core/axe.min.js || echo "Controllo di accessibilità non riuscito"
      - name: Controllo
        id: c
        timeout-minutes: 10
        run: python strumenti/controllo-settimanale.py
      - name: Avviso nella scheda Issues
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMI: ${{ steps.c.outputs.problemi }}
        run: |
          TITOLO="Controllo settimanale del sito"
          gh label create controllo --color E8702A --description "Avvisi del robot settimanale" 2>/dev/null || true
          NUM=$(gh issue list --label controllo --state open --json number --jq '.[0].number')
          if [ "$PROBLEMI" = "si" ]; then
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file controllo.md
              gh issue comment "$NUM" --body "Resoconto aggiornato: ci sono cose da fare o da tenere d'occhio."
            else
              gh issue create --title "$TITOLO" --label controllo --body-file controllo.md
            fi
          elif [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file controllo.md
            gh issue close "$NUM"
          fi
